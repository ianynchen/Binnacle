[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binnacle-router"
version = "0.1.0"
description = "REST + MCP surface for binnacle-core (library, not a service)."
requires-python = ">=3.13"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/binnacle_router"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "binnacle_router"
include_external_packages = true
# Contracts deferred to binnacle-router's own future spec (see spec DR-7) -- this section currently enforces nothing.
