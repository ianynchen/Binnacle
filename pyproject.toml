[project]
name = "binnacle-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/binnacle-core"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "mypy",
  "ruff",
  "import-linter",
  "pre-commit",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["binnacle_core"]
