name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: binnacle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BINNACLE_TEST_DSN: postgresql://postgres:postgres@localhost:5432/binnacle_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d binnacle_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Install JS dependencies
        run: pnpm install

      - name: Run gates
        run: bash scripts/check.sh

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --hook-stage push
